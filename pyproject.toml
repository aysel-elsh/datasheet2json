[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheet2json"
version = "0.1.0"
description = "Pull spec tables (absolute max ratings, electrical characteristics, timing) out of electronic component datasheet PDFs into JSON or CSV."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aysel Elshenawy" }]
requires-python = ">=3.9"
dependencies = ["pdfplumber>=0.10"]
keywords = ["datasheet", "pdf", "electronics", "components", "table-extraction", "bom", "electrical-engineering"]

[project.urls]
Homepage = "https://github.com/aysel-elsh/datasheet2json"
Issues = "https://github.com/aysel-elsh/datasheet2json/issues"

[project.scripts]
datasheet2json = "datasheet2json.cli:main"

[project.optional-dependencies]
test = ["pytest", "reportlab"]

[tool.setuptools.packages.find]
where = ["src"]
